[project]
name = "virt-graph"
version = "1.9.0"
description = "Graph-like queries over relational data using LLM reasoning"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pyyaml>=6.0",
    "linkml>=1.7",
]

[project.optional-dependencies]
db = [
    "psycopg[binary] (>=3.1)",
]
handlers = [
    "psycopg[binary] (>=3.1)",
    "networkx>=3.2",
]
neo4j = [
    "neo4j>=5.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "tabulate>=0.9",
]
all = [
    "psycopg[binary] (>=3.1)",
    "networkx>=3.2",
    "neo4j>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.poetry]
packages = [{include = "virt_graph", from = "src"}]
include = [{path = "src/virt_graph/virt_graph.yaml", format = ["sdist", "wheel"]}]

[tool.pytest.ini_options]
testpaths = ["pcg_example/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "psycopg[binary] (>=3.1,<4.0.0)",
    "networkx (>=3.2,<4.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.0,<10.0.0)",
    "folium (>=0.20.0,<0.21.0)"
]
notebooks = [
    "pandas (>=3.0.1,<4.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "scipy (>=1.17.1,<2.0.0)"
]
