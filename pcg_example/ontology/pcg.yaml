# ============================================================================
# Prism Consumer Goods (PCG) - ERP Supply Chain Ontology
# ============================================================================
#
# Virtual twin declaration for the PCG schema (38 tables, ~395M rows, 365-day sim).
# Uses class hierarchy via scm_base.yaml imports (is_a, mixins, abstract classes).
#
# v3.0 — Structural Hierarchy:
#   - Imports scm_base.yaml for abstract classes, mixins, shared slots, enums
#   - Location hierarchy: Plant, DistributionCenter, RetailLocation → Location
#   - TransactionDocument hierarchy: PO, GR, Order, Shipment, Return, AP/AR → TransactionDocument
#   - LineItem hierarchy: all line items → LineItem
#   - Mixins: HasActiveFlag, HasName for master data entities
#   - LocationType enum for polymorphic location_type columns
#
# v2.0 — Complete Virtual Twin Declaration:
#   - 50 relationships: all FK columns mapped, including polymorphic
#   - Operation types: 8 of 11 types used
#   - Transport network, SKU alias chain, BOM hierarchy
#   - Polymorphic relationships, context blocks, edge attributes
#   - OWL 2 role axioms: functional, asymmetric, irreflexive, acyclic
#
# Kinetic Annotations (v3.0):
#   - State machines: 9 entities with status lifecycle
#   - Axioms: Physics constraints (mass balance, temporal order, GL balance)
#   - Actions: Business mutation semantics for what-if reasoning
#   - Scenario params: Perturbable attributes for sensitivity analysis
#   - Flow config: Material/financial flow metadata on key relationships
#
# Dates are INTEGER (day number 1-365), not timestamps.
# transaction_sequence_id provides causal ordering across tables.
#
# Validation:
#   Layer 1: poetry run linkml-lint --validate-only pcg_example/ontology/pcg.yaml
#   Layer 2: OntologyAccessor("pcg_example/ontology/pcg.yaml", validate=True)

id: https://virt-graph.dev/schemas/pcg
name: pcg
version: "3.0.0"
description: >-
  Prism Consumer Goods ERP ontology for Virtual Graph.
  Models a full FMCG supply chain across 8 domains: Source, Transform,
  Product, Order, Fulfill, Logistics, Plan, Return, and Finance.
  38 entity classes with class hierarchy (Location, TransactionDocument,
  LineItem), 50 relationships with polymorphic patterns, transport network
  graph, recursive alias chains, context blocks, and kinetic annotations.

prefixes:
  linkml: https://w3id.org/linkml/
  vg: https://virt-graph.dev/

imports:
  - linkml:types
  - scm_base

default_range: string

annotations:
  vg:database_type: postgresql
  vg:database_version: "15"
  vg:connection_string: "postgresql://virt_graph:dev_password@localhost:5433/prism_fmcg"

# =============================================================================
# CLASSES
# =============================================================================

classes:

  # ===========================================================================
  # DOMAIN A: SOURCE (Procurement & Inbound)
  # ===========================================================================

  Supplier:
    description: "Raw material and ingredient supplier"
    mixins:
      - HasActiveFlag
      - HasName
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: suppliers
      vg:primary_key: id
      vg:identifier: supplier_code
      vg:scenario_params: >-
        [
          {"attribute": "lead_time_days", "propagation": "downstream", "description": "Supplier lead time affects PO receipt timing", "default_perturbation": "+50%"}
        ]
    attributes:
      supplier_code:
        range: string
      country:
        range: string
      tier:
        range: integer

  Ingredient:
    description: "Raw material input to manufacturing formulas"
    mixins:
      - HasActiveFlag
      - HasName
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: ingredients
      vg:primary_key: id
      vg:identifier: ingredient_code
    attributes:
      ingredient_code:
        range: string
      category:
        range: string
      cost_per_kg:
        range: decimal

  SupplierIngredient:
    description: "Supplier-ingredient catalog with cost and lead time"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: supplier_ingredients
      vg:primary_key: id
    attributes:
      unit_cost:
        range: decimal
      lead_time_days:
        range: integer
      min_order_qty:
        range: decimal

  PurchaseOrder:
    description: "Purchase order header for procuring ingredients"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: purchase_orders
      vg:primary_key: id
      vg:identifier: po_number
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["open", "received", "closed"],
          "transitions": [
            {"from_state": "open", "to_state": "received", "description": "Goods receipt confirmed"},
            {"from_state": "received", "to_state": "closed", "description": "Invoice matched and paid"}
          ],
          "initial_state": "open",
          "terminal_states": ["closed"]
        }
    attributes:
      po_number:
        range: string
      order_date:
        range: integer

  PurchaseOrderLine:
    description: "Line item on a purchase order"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: purchase_order_lines
      vg:primary_key: '["po_id", "line_number"]'
    attributes:
      quantity_kg:
        range: decimal
      unit_cost:
        range: decimal

  GoodsReceipt:
    description: "Goods receipt header confirming delivery of purchased materials"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: goods_receipts
      vg:primary_key: id
      vg:identifier: gr_number
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["received", "inspected", "posted"],
          "transitions": [
            {"from_state": "received", "to_state": "inspected", "description": "Quality inspection complete"},
            {"from_state": "inspected", "to_state": "posted", "description": "Posted to inventory"}
          ],
          "initial_state": "received",
          "terminal_states": ["posted"]
        }
    attributes:
      gr_number:
        range: string
      receipt_date:
        range: integer

  GoodsReceiptLine:
    description: "Line item on a goods receipt"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: goods_receipt_lines
      vg:primary_key: '["gr_id", "line_number"]'
    attributes:
      quantity_kg:
        range: decimal

  # ===========================================================================
  # DOMAIN B: TRANSFORM (Manufacturing)
  # ===========================================================================

  Plant:
    description: "Manufacturing plant with production capacity"
    is_a: Location
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: plants
      vg:primary_key: id
      vg:identifier: plant_code
      vg:axioms: >-
        [
          {
            "name": "capacity_positive",
            "description": "Plant capacity must be positive",
            "axiom_type": "value_range",
            "sql_expression": "capacity_tons_per_day > 0",
            "severity": "error"
          }
        ]
      vg:scenario_params: >-
        [
          {"attribute": "capacity_tons_per_day", "propagation": "downstream", "description": "Plant capacity affects production throughput", "default_perturbation": "-20%"}
        ]
    attributes:
      plant_code:
        range: string
      capacity_tons_per_day:
        range: decimal

  ProductionLine:
    description: "Production line within a plant"
    mixins:
      - HasActiveFlag
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: production_lines
      vg:primary_key: id
      vg:identifier: line_code
    attributes:
      line_code:
        range: string
      line_type:
        range: string
      capacity_units_per_hour:
        range: integer

  Formula:
    description: "Manufacturing formula (recipe/BOM) for producing a product"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: formulas
      vg:primary_key: id
      vg:identifier: formula_code
    attributes:
      formula_code:
        range: string
      name:
        range: string
      batch_size_kg:
        range: decimal
      yield_percent:
        range: decimal

  FormulaIngredient:
    description: "Ingredient requirement within a formula"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: formula_ingredients
      vg:primary_key: '["formula_id", "ingredient_id", "sequence"]'
    attributes:
      quantity_kg:
        range: decimal
      sequence:
        range: integer

  WorkOrder:
    description: "Manufacturing work order for planned production"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: work_orders
      vg:primary_key: id
      vg:identifier: wo_number
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["planned", "in_progress", "completed"],
          "transitions": [
            {"from_state": "planned", "to_state": "in_progress", "description": "Production started"},
            {"from_state": "in_progress", "to_state": "completed", "description": "Production finished"}
          ],
          "initial_state": "planned",
          "terminal_states": ["completed"]
        }
    attributes:
      wo_number:
        range: string
      planned_quantity_kg:
        range: decimal

  Batch:
    description: "Production batch output from a work order"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: batches
      vg:primary_key: id
      vg:identifier: batch_number
      vg:context: >-
        {
          "business_logic": "product_type discriminates output: finished_good → SKU, bulk_intermediate → BulkIntermediate. bom_level indicates BOM depth (0=finished, 1=intermediate). Mass balance holds between input ingredients and output quantity.",
          "llm_prompt_hint": "Use product_type to determine which product table to join. For BOM tracing, follow formula_id → formula_ingredients."
        }
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["pending", "in_progress", "completed"],
          "transitions": [
            {"from_state": "pending", "to_state": "in_progress", "description": "Batch production started"},
            {"from_state": "in_progress", "to_state": "completed", "description": "Batch production finished"}
          ],
          "initial_state": "pending",
          "terminal_states": ["completed"]
        }
      vg:axioms: >-
        [
          {
            "name": "yield_range",
            "description": "Yield percent must be between 0 and 100",
            "axiom_type": "value_range",
            "sql_expression": "yield_percent BETWEEN 0 AND 100",
            "severity": "error"
          }
        ]
      vg:actions: >-
        [
          {
            "name": "start_production",
            "description": "Begin batch production, consuming ingredients",
            "preconditions": ["status = 'pending'", "work order is in_progress"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "pending -> in_progress"}
            ]
          },
          {
            "name": "complete_production",
            "description": "Finish batch production, output available for shipment",
            "preconditions": ["status = 'in_progress'"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "in_progress -> completed"},
              {"attribute": "yield_percent", "effect_type": "set", "description": "Actual yield recorded"}
            ]
          }
        ]
    attributes:
      batch_number:
        range: string
      quantity_kg:
        range: decimal
      yield_percent:
        range: decimal
      production_date:
        range: integer
      product_type:
        range: string
      bom_level:
        range: integer

  BatchIngredient:
    description: "Actual ingredient consumption in a batch"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: batch_ingredients
      vg:primary_key: id
    attributes:
      quantity_kg:
        range: decimal

  # ===========================================================================
  # DOMAIN C: PRODUCT (SKU Master)
  # ===========================================================================

  BulkIntermediate:
    description: "Intermediate bulk product (e.g., paste, base compound)"
    mixins:
      - HasActiveFlag
      - HasName
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: bulk_intermediates
      vg:primary_key: id
      vg:identifier: bulk_code
    attributes:
      bulk_code:
        range: string
      category:
        range: string

  SKU:
    description: "Stock keeping unit - finished good for sale"
    mixins:
      - HasActiveFlag
      - HasName
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: skus
      vg:primary_key: id
      vg:identifier: sku_code
    attributes:
      sku_code:
        range: string
      category:
        range: string
      brand:
        range: string
      price_per_case:
        range: decimal
      supersedes_sku_id:
        range: integer

  # ===========================================================================
  # DOMAIN D: ORDER (Demand Signal)
  # ===========================================================================

  Channel:
    description: "Sales channel (retail, wholesale, e-commerce)"
    mixins:
      - HasActiveFlag
      - HasName
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: channels
      vg:primary_key: id
      vg:identifier: channel_code
    attributes:
      channel_code:
        range: string
      channel_type:
        range: string

  Order:
    description: "Customer order header"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: orders
      vg:primary_key: id
      vg:identifier: order_number
      vg:context: >-
        {
          "business_logic": "Multi-step fulfillment lifecycle (pending→allocated→shipped→delivered). source_id references a channel, retail_location_id is the delivery destination.",
          "llm_prompt_hint": "Join source_id → channels for channel analysis. Join retail_location_id → retail_locations for geographic analysis."
        }
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["pending", "allocated", "shipped", "delivered"],
          "transitions": [
            {"from_state": "pending", "to_state": "allocated", "description": "Inventory reserved"},
            {"from_state": "allocated", "to_state": "shipped", "description": "Shipment dispatched"},
            {"from_state": "shipped", "to_state": "delivered", "description": "Customer confirmed receipt"}
          ],
          "initial_state": "pending",
          "terminal_states": ["delivered"]
        }
      vg:actions: >-
        [
          {
            "name": "allocate",
            "description": "Reserve inventory for order fulfillment",
            "preconditions": ["status = 'pending'", "inventory >= total_cases"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "pending -> allocated"}
            ],
            "affected_relationships": ["OrderHasLines"]
          },
          {
            "name": "ship",
            "description": "Dispatch shipment for order",
            "preconditions": ["status = 'allocated'"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "allocated -> shipped"}
            ],
            "affected_relationships": ["ShipmentHasLines"]
          }
        ]
      vg:scenario_params: >-
        [
          {"attribute": "total_cases", "propagation": "downstream", "description": "Order volume affects shipment and inventory", "default_perturbation": "+20%"}
        ]
    attributes:
      order_number:
        range: string
      day:
        range: integer
      total_cases:
        range: integer

  OrderLine:
    description: "Line item on a customer order"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: order_lines
      vg:primary_key: '["order_id", "line_number"]'
    attributes:
      quantity_cases:
        range: decimal
      unit_price:
        range: decimal

  # ===========================================================================
  # DOMAIN E: FULFILL (Outbound)
  # ===========================================================================

  DistributionCenter:
    description: "Distribution center / warehouse"
    is_a: Location
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: distribution_centers
      vg:primary_key: id
      vg:identifier: dc_code
    attributes:
      dc_code:
        range: string
      type:
        range: string

  RetailLocation:
    description: "Retail store or customer delivery point"
    is_a: Location
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: retail_locations
      vg:primary_key: id
      vg:identifier: location_code
    attributes:
      location_code:
        range: string
      store_format:
        range: string

  Shipment:
    description: "Outbound shipment to customer or distribution center"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: shipments
      vg:primary_key: id
      vg:identifier: shipment_number
      vg:context: >-
        {
          "business_logic": "origin_id and destination_id are polymorphic — they reference plants, distribution centers, or retail locations without explicit type columns. route_type may indicate the pattern (e.g., plant_to_dc, dc_to_retail).",
          "llm_prompt_hint": "Use route_type to infer origin/destination types. For precise resolution, cross-reference with route_segments which have explicit type columns."
        }
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["planned", "in_transit", "delivered"],
          "transitions": [
            {"from_state": "planned", "to_state": "in_transit", "description": "Shipment departed origin"},
            {"from_state": "in_transit", "to_state": "delivered", "description": "Shipment arrived at destination"}
          ],
          "initial_state": "planned",
          "terminal_states": ["delivered"]
        }
      vg:axioms: >-
        [
          {
            "name": "temporal_order",
            "description": "Arrival date must be on or after ship date",
            "axiom_type": "temporal_order",
            "sql_expression": "arrival_date >= ship_date OR arrival_date IS NULL",
            "severity": "error"
          }
        ]
      vg:actions: >-
        [
          {
            "name": "dispatch",
            "description": "Dispatch shipment from origin",
            "preconditions": ["status = 'planned'"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "planned -> in_transit"}
            ]
          },
          {
            "name": "deliver",
            "description": "Mark shipment as delivered",
            "preconditions": ["status = 'in_transit'"],
            "effects": [
              {"attribute": "status", "effect_type": "trigger_transition", "description": "in_transit -> delivered"}
            ]
          }
        ]
    attributes:
      shipment_number:
        range: string
      ship_date:
        range: integer
      arrival_date:
        range: integer
      route_type:
        range: string
      freight_cost:
        range: decimal

  ShipmentLine:
    description: "Line item on a shipment"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: shipment_lines
      vg:primary_key: '["shipment_id", "line_number"]'
    attributes:
      quantity_cases:
        range: decimal
      weight_kg:
        range: decimal

  Inventory:
    description: "Daily inventory snapshot by location and SKU"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: inventory
      vg:primary_key: id
      vg:context: >-
        {
          "business_logic": "Daily snapshots of inventory levels. location_type discriminates the polymorphic location_id (plant, dc, retail). Use day column for temporal queries.",
          "llm_prompt_hint": "Filter by location_type to determine which location table to join. For trend analysis, GROUP BY day."
        }
      vg:axioms: >-
        [
          {
            "name": "quantity_non_negative",
            "description": "Inventory quantity must not be negative",
            "axiom_type": "value_range",
            "sql_expression": "quantity_cases >= 0",
            "severity": "warning"
          }
        ]
    attributes:
      day:
        range: integer
      location_type:
        range: LocationType
      quantity_cases:
        range: decimal

  # ===========================================================================
  # DOMAIN E2: LOGISTICS (Transport Network)
  # ===========================================================================

  RouteSegment:
    description: "Transport route segment between two locations"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: route_segments
      vg:primary_key: id
      vg:identifier: segment_code
      vg:context: >-
        {
          "business_logic": "This IS the transport network graph. Origin and destination are polymorphic locations (plant, dc, retail) with explicit type columns. distance_km and transit_time_hours are edge weights for pathfinding.",
          "llm_prompt_hint": "Use RouteSegmentOrigin/RouteSegmentDestination relationships for graph traversal. Weight by distance_km for shortest distance, transit_time_hours for fastest route."
        }
    attributes:
      segment_code:
        range: string
      origin_type:
        range: LocationType
      destination_type:
        range: LocationType
      transport_mode:
        range: string
      distance_km:
        range: decimal
      transit_time_hours:
        range: decimal

  # ===========================================================================
  # DOMAIN F: PLAN (Demand & Supply Planning)
  # ===========================================================================

  DemandForecast:
    description: "Demand forecast for SKU at location"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: demand_forecasts
      vg:primary_key: id
    attributes:
      forecast_version:
        range: string
      location_type:
        range: LocationType
      forecast_date:
        range: integer
      forecast_quantity_cases:
        range: decimal
      forecast_type:
        range: string

  # ===========================================================================
  # DOMAIN G: RETURN (Regenerate)
  # ===========================================================================

  Return:
    description: "Customer return (RMA) header"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: returns
      vg:primary_key: id
      vg:identifier: return_number
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["received", "inspected", "disposed"],
          "transitions": [
            {"from_state": "received", "to_state": "inspected", "description": "Return inspected for condition"},
            {"from_state": "inspected", "to_state": "disposed", "description": "Disposition decision applied"}
          ],
          "initial_state": "received",
          "terminal_states": ["disposed"]
        }
    attributes:
      return_number:
        range: string
      return_date:
        range: integer

  ReturnLine:
    description: "Line item on a customer return"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: return_lines
      vg:primary_key: '["return_id", "line_number"]'
    attributes:
      quantity_cases:
        range: decimal
      condition:
        range: string

  DispositionLog:
    description: "Disposition action for returned goods"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: disposition_logs
      vg:primary_key: '["return_id", "return_line_number"]'
    attributes:
      disposition:
        range: string
      quantity_cases:
        range: decimal

  # ===========================================================================
  # DOMAIN H: FINANCE
  # ===========================================================================

  ChartOfAccounts:
    description: "General ledger chart of accounts"
    mixins:
      - HasActiveFlag
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: chart_of_accounts
      vg:primary_key: id
      vg:identifier: account_code
    attributes:
      account_code:
        range: string
      account_name:
        range: string
      account_type:
        range: string

  GLJournal:
    description: "General ledger journal entry"
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: gl_journal
      vg:primary_key: id
      vg:context: >-
        {
          "business_logic": "reference_type determines what the entry relates to (purchase_order, goods_receipt, batch, order, shipment, etc.). is_reversal marks correction entries. GL balance must hold per day (debits = credits).",
          "llm_prompt_hint": "Use reference_type and reference_id to trace GL entries back to source documents. Filter is_reversal = false for net balances."
        }
      vg:axioms: >-
        [
          {
            "name": "gl_balance",
            "description": "Total debits must equal total credits per day",
            "axiom_type": "conservation",
            "sql_expression": "ABS(SUM(debit_amount) - SUM(credit_amount)) < 0.01",
            "severity": "error"
          }
        ]
    attributes:
      entry_date:
        range: integer
      debit_amount:
        range: decimal
      credit_amount:
        range: decimal
      reference_type:
        range: string

  APInvoice:
    description: "Accounts payable invoice from supplier"
    is_a: TransactionDocument
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: ap_invoices
      vg:primary_key: id
      vg:identifier: invoice_number
      vg:state_machine: >-
        {
          "state_column": "status",
          "states": ["open", "paid"],
          "transitions": [
            {"from_state": "open", "to_state": "paid", "description": "Payment processed"}
          ],
          "initial_state": "open",
          "terminal_states": ["paid"]
        }
    attributes:
      invoice_number:
        range: string
      invoice_date:
        range: integer
      total_amount:
        range: decimal

  APInvoiceLine:
    description: "Line item on an AP invoice"
    is_a: LineItem
    instantiates:
      - vg:SQLMappedClass
    annotations:
      vg:table: ap_invoice_lines
      vg:primary_key: '["invoice_id", "line_number"]'
    attributes:
      quantity_kg:
        range: decimal
      line_amount:
        range: decimal

