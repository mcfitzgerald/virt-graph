services:
  neo4j:
    image: neo4j:5-community
    container_name: pcg_neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/dev_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "neo4j status | grep -q 'Neo4j is running'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
