# Virtual Graph Metamodel Extension for LinkML
# Defines extension classes for mapping semantic concepts to SQL schema
#
# This metamodel provides:
# - SQLMappedClass: For entity classes (TBox concepts)
# - SQLMappedRelationship: For relationship classes (RBox roles)
# - Supporting types for operation types, weight columns, etc.

id: https://virt-graph.dev/metamodel
name: virt_graph_metamodel
version: "3.0"
description: >-
  Virtual Graph metamodel extension for LinkML.
  Enables graph-like queries over relational data by mapping
  semantic concepts to physical SQL schema.

prefixes:
  linkml: https://w3id.org/linkml/
  vg: https://virt-graph.dev/

imports:
  - linkml:types

default_range: string

# =============================================================================
# ENUMS
# =============================================================================

enums:
  Cardinality:
    description: "Cardinality constraints for relationship endpoints"
    permissible_values:
      ZERO_OR_ONE:
        description: "0..1 - Optional single value"
      EXACTLY_ONE:
        description: "1..1 - Required single value"
      ZERO_OR_MORE:
        description: "0..* - Optional multiple values"
      ONE_OR_MORE:
        description: "1..* - Required multiple values"

  OperationCategory:
    description: >-
      High-level classification of graph operation families.
      Determines which handler type to use for queries.
    permissible_values:
      direct:
        description: "Simple SQL joins/filters - standard SQL"
      traversal:
        description: "Recursive path-following (BFS/DFS) - traverse() handler"
      temporal:
        description: "Time-aware queries - traverse(valid_at=...) handler"
      aggregation:
        description: "Value aggregation along paths - path_aggregate() handler"
      algorithm:
        description: "Global graph analysis - NetworkX-based handlers"
      pattern:
        description: "Subgraph pattern matching (future)"
      kinetic:
        description: "Flow/state/scenario analysis - virtual kinetics"

  OperationType:
    description: >-
      Specific handler operations. Each type belongs to exactly one category.
      Maps directly to handler functions for query execution.
    permissible_values:
      direct_join:
        description: "Simple FK lookups, junction tables (category: direct)"
      recursive_traversal:
        description: "Multi-hop paths through relationships (category: traversal)"
      temporal_traversal:
        description: "Time-bounded path following (category: temporal)"
      path_aggregation:
        description: "SUM/MAX/MIN along paths (category: aggregation)"
      hierarchical_aggregation:
        description: "Quantity propagation like BOM explosion (category: aggregation)"
      shortest_path:
        description: "Optimal route between nodes (category: algorithm)"
      centrality:
        description: "Node importance ranking (category: algorithm)"
      connected_components:
        description: "Find isolated clusters (category: algorithm)"
      resilience_analysis:
        description: "Impact of node removal (category: algorithm)"
      flow_analysis:
        description: "Throughput, bottleneck, and conservation analysis (category: kinetic)"
      state_analysis:
        description: "State machine transition and lifecycle analysis (category: kinetic)"
      scenario_analysis:
        description: "What-if perturbation and impact propagation (category: kinetic)"

  AxiomSeverity:
    description: "Severity level for axiom violations"
    permissible_values:
      error:
        description: "Hard constraint - violation indicates data corruption"
      warning:
        description: "Soft constraint - violation indicates anomaly worth investigating"
      info:
        description: "Informational check - violation is expected in edge cases"

  AxiomType:
    description: "Classification of axiom constraints"
    permissible_values:
      value_range:
        description: "Column value must be within expected range (e.g., yield_percent BETWEEN 0 AND 100)"
      temporal_order:
        description: "Temporal ordering constraint (e.g., arrival_date >= ship_date)"
      conservation:
        description: "Quantity/value conservation across related entities (e.g., mass balance)"
      conditional:
        description: "Constraint that applies only when a condition is met"
      referential:
        description: "Cross-table referential integrity beyond FK constraints"

  FlowType:
    description: "Classification of material/information/financial flows"
    permissible_values:
      material:
        description: "Physical goods movement (kg, cases, units)"
      information:
        description: "Data/document flow (orders, forecasts, plans)"
      financial:
        description: "Monetary flow (invoices, payments, receipts)"

  ActionEffectType:
    description: "Type of effect an action has on entity attributes"
    permissible_values:
      set:
        description: "Set attribute to a specific value"
      increment:
        description: "Add to or subtract from attribute value"
      trigger_transition:
        description: "Trigger a state machine transition"

  PropagationDirection:
    description: "Direction of perturbation propagation in scenario analysis"
    permissible_values:
      upstream:
        description: "Propagates to suppliers/predecessors"
      downstream:
        description: "Propagates to customers/successors"
      local:
        description: "Affects only the entity itself"

# =============================================================================
# EXTENSION CLASSES
# =============================================================================

classes:
  # ---------------------------------------------------------------------------
  # SQLMappedClass: Extension for entity tables (TBox)
  # ---------------------------------------------------------------------------
  SQLMappedClass:
    class_uri: vg:SQLMappedClass
    description: >-
      Extension class for entities that map to SQL tables.
      Use this for TBox concepts (Supplier, Part, Product, etc.)
    attributes:
      table:
        range: string
        required: true
        description: "SQL table name"
      primary_key:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: "Primary key column(s). Single value for simple keys, list for composite keys (e.g., '[\"order_id\", \"line_number\"]')"
      identifier:
        range: string
        multivalued: true
        description: "Natural key column(s) for human-readable identification"
      soft_delete_column:
        range: string
        description: "Column name for soft delete timestamp (e.g., deleted_at)"
      row_count:
        range: integer
        description: "Estimated row count for query planning"
      context:
        range: ContextBlock
        inlined: true
        description: "Structured context for AI-assisted query generation"

      # === Kinetic Extensions (v3.0) ===
      axioms:
        range: Axiom
        multivalued: true
        inlined_as_list: true
        description: "SQL-evaluable constraints for data integrity validation"
      state_machine:
        range: StateMachine
        inlined: true
        description: "Lifecycle state machine definition for status-bearing entities"
      actions:
        range: Action
        multivalued: true
        inlined_as_list: true
        description: "Semantic mutation definitions for what-if reasoning (NOT executable)"
      scenario_params:
        range: ScenarioParam
        multivalued: true
        inlined_as_list: true
        description: "Perturbable attributes for scenario/what-if analysis"

  # ---------------------------------------------------------------------------
  # SQLMappedRelationship: Extension for relationships (RBox)
  # ---------------------------------------------------------------------------
  SQLMappedRelationship:
    class_uri: vg:SQLMappedRelationship
    description: >-
      Extension class for relationships between entities.
      Use this for RBox roles (supplies_to, component_of, connects_to, etc.)
    attributes:
      # === SQL Mapping ===
      edge_table:
        range: string
        required: true
        description: "Edge/junction table name (or target table for embedded FKs)"
      domain_key:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: "FK column(s) pointing to domain class. List for composite keys (e.g., '[\"order_id\", \"line_number\"]')"
      range_key:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: "FK column(s) pointing to range class. List for composite keys"
      domain_class:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: "Name(s) of domain class(es). List for polymorphic relationships"
      range_class:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        description: "Name(s) of range class(es). List for polymorphic relationships (e.g., '[\"User\", \"Organization\"]')"

      # === Operation Types ===
      operation_types:
        range: OperationType
        multivalued: true
        description: >-
          Operations supported on this relationship.
          Maps to specific handler functions for query execution.

      temporal_bounds:
        range: TemporalBounds
        description: "Time validity configuration for temporal_traversal operations"

      # === OWL 2 Role Axioms ===
      transitive:
        range: boolean
        description: "R(x,y) and R(y,z) implies R(x,z)"
      symmetric:
        range: boolean
        description: "R(x,y) implies R(y,x)"
      asymmetric:
        range: boolean
        description: "R(x,y) implies NOT R(y,x)"
      reflexive:
        range: boolean
        description: "R(x,x) always holds"
      irreflexive:
        range: boolean
        description: "R(x,x) never holds (no self-loops)"
      functional:
        range: boolean
        description: "Each domain element relates to at most one range element"
      inverse_functional:
        range: boolean
        description: "Each range element relates to at most one domain element"

      # === Virtual Graph Extensions ===
      acyclic:
        range: boolean
        description: "DAG constraint - no cycles allowed"
      is_hierarchical:
        range: boolean
        description: "Represents a hierarchical/tree-like structure"
      is_weighted:
        range: boolean
        description: "Relationship has numeric weight columns for network algorithms"
      inverse_of:
        range: string
        description: "Name of inverse relationship (e.g., component_of inverse_of has_component)"

      # === Cardinality ===
      cardinality_domain:
        range: string
        description: "Domain cardinality (e.g., '0..*', '1..1')"
      cardinality_range:
        range: string
        description: "Range cardinality (e.g., '0..*', '1..1')"

      # === DDL Metadata ===
      has_self_ref_constraint:
        range: boolean
        description: "Table has CHECK constraint preventing self-references"
      has_unique_edge_index:
        range: boolean
        description: "Table has unique index on (domain_key, range_key)"
      indexed_columns:
        range: string
        multivalued: true
        description: "List of indexed column names"

      # === Weight Columns (for network algorithms) ===
      weight_columns:
        range: WeightColumn
        multivalued: true
        inlined_as_list: true
        description: "Numeric columns usable as edge weights in network algorithms"

      # === Statistics ===
      row_count:
        range: integer
        description: "Estimated edge count for query planning"

      # === AI Context ===
      context:
        range: ContextBlock
        inlined: true
        description: "Structured context for AI-assisted query generation"

      # === Edge Filtering ===
      sql_filter:
        range: string
        description: "SQL WHERE clause to filter edges (e.g., 'is_active = true AND status != suspended')"

      # === Property Graph Extensions ===
      edge_attributes:
        range: EdgeAttribute
        multivalued: true
        inlined_as_list: true
        description: "Non-weight columns to retrieve as edge properties in Property Graph style"

      # === Polymorphism ===
      type_discriminator:
        range: TypeDiscriminator
        inlined: true
        description: "Configuration for resolving polymorphic target types based on a discriminator column"

      # === Kinetic Extensions (v3.0) ===
      axioms:
        range: Axiom
        multivalued: true
        inlined_as_list: true
        description: "SQL-evaluable constraints on this relationship"
      flow_config:
        range: FlowConfig
        inlined: true
        description: "Material/information/financial flow metadata for throughput analysis"

  # ---------------------------------------------------------------------------
  # WeightColumn: Describes a numeric column usable as edge weight
  # ---------------------------------------------------------------------------
  WeightColumn:
    class_uri: vg:WeightColumn
    description: "A numeric column that can be used as an edge weight in network algorithms"
    attributes:
      name:
        range: string
        required: true
        description: "Column name"
      type:
        range: string
        required: true
        description: "SQL data type (e.g., 'decimal', 'integer', 'float')"
      description:
        range: string
        description: "Human-readable description of what this weight represents"
      unit:
        range: string
        description: "Unit of measurement (e.g., 'km', 'usd', 'hours')"

  # ---------------------------------------------------------------------------
  # TemporalBounds: Configuration for time-bounded edge filtering
  # ---------------------------------------------------------------------------
  TemporalBounds:
    class_uri: vg:TemporalBounds
    description: >-
      Configuration for time-bounded edge filtering in temporal_traversal operations.
      Specifies which columns contain the validity period for edges.
    attributes:
      start_col:
        range: string
        required: true
        description: "Column containing edge start/effective date"
      end_col:
        range: string
        required: true
        description: "Column containing edge end/expiry date"

  # ---------------------------------------------------------------------------
  # DatabaseConnection: Schema-level metadata for database connection
  # ---------------------------------------------------------------------------
  DatabaseConnection:
    class_uri: vg:DatabaseConnection
    description: "Database connection metadata for schema-level annotation"
    attributes:
      database_type:
        range: string
        required: true
        description: "Database type (e.g., 'postgresql', 'mysql', 'sqlite')"
      database_version:
        range: string
        description: "Database version"
      connection_string:
        range: string
        description: "Connection string template (credentials should be externalized)"

  # ---------------------------------------------------------------------------
  # ContextBlock: Structured context for AI-assisted query generation
  # ---------------------------------------------------------------------------
  ContextBlock:
    class_uri: vg:ContextBlock
    description: "Structured context for AI-assisted query generation"
    attributes:
      definition:
        range: string
        description: "Formal business definition or glossary term (What is this?)"
      business_logic:
        range: string
        description: "Human-readable explanation of entity/relationship behavior"
      data_quality_notes:
        range: string
        description: "Known data issues, reliability warnings, or scope limitations"
      llm_prompt_hint:
        range: string
        description: "Hints for AI query construction (e.g., 'For strategic suppliers, filter tier=1')"
      traversal_semantics:
        range: TraversalSemantics
        inlined: true
        description: "Direction-specific traversal meaning"
      examples:
        range: string
        multivalued: true
        description: "Example natural language queries this applies to"

  # ---------------------------------------------------------------------------
  # TraversalSemantics: Direction-specific traversal behavior
  # ---------------------------------------------------------------------------
  TraversalSemantics:
    class_uri: vg:TraversalSemantics
    description: "Direction-specific traversal behavior for relationships"
    attributes:
      inbound:
        range: string
        description: "Meaning of inbound traversal (e.g., 'upstream suppliers')"
      outbound:
        range: string
        description: "Meaning of outbound traversal (e.g., 'downstream buyers')"

  # ---------------------------------------------------------------------------
  # EdgeAttribute: Non-weight column to retrieve as edge property
  # ---------------------------------------------------------------------------
  EdgeAttribute:
    class_uri: vg:EdgeAttribute
    description: "Non-weight column to retrieve as edge property in Property Graph style"
    attributes:
      name:
        range: string
        required: true
        description: "Column name in edge table"
      type:
        range: string
        required: true
        description: "Data type (e.g., 'string', 'date', 'boolean')"
      description:
        range: string
        description: "Human-readable description of this edge property"

  # ---------------------------------------------------------------------------
  # DiscriminatorEntry: Maps discriminator value to target class
  # ---------------------------------------------------------------------------
  DiscriminatorEntry:
    class_uri: vg:DiscriminatorEntry
    description: "Maps a discriminator column value to a target class"
    attributes:
      discriminator_value:
        range: string
        identifier: true
        description: "Value in discriminator column (e.g., 'user', 'org')"
      target_class:
        range: string
        required: true
        description: "Target entity class name (e.g., 'User', 'Organization')"

  # ---------------------------------------------------------------------------
  # TypeDiscriminator: Polymorphic target type resolution
  # ---------------------------------------------------------------------------
  TypeDiscriminator:
    class_uri: vg:TypeDiscriminator
    description: "Configuration for resolving polymorphic relationship targets"
    attributes:
      column:
        range: string
        required: true
        description: "Column containing type indicator value"
      mapping:
        range: DiscriminatorEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: "Maps discriminator values to target class names"

  # ===========================================================================
  # KINETIC EXTENSION CLASSES (v3.0)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Axiom: SQL-evaluable constraint for data integrity validation
  # ---------------------------------------------------------------------------
  Axiom:
    class_uri: vg:Axiom
    description: >-
      A SQL-evaluable constraint that can be checked against live data.
      Claude evaluates axioms via: SELECT COUNT(*) FROM table WHERE NOT (sql_expression)
    attributes:
      name:
        range: string
        required: true
        description: "Unique name for this axiom (e.g., 'mass_balance', 'temporal_order')"
      description:
        range: string
        required: true
        description: "Human-readable explanation of what this axiom checks"
      axiom_type:
        range: AxiomType
        required: true
        description: "Classification of the constraint type"
      sql_expression:
        range: string
        required: true
        description: "SQL boolean expression that should be true for valid rows"
      severity:
        range: AxiomSeverity
        required: true
        description: "How serious a violation of this axiom is"

  # ---------------------------------------------------------------------------
  # StateTransition: A valid transition in a state machine
  # ---------------------------------------------------------------------------
  StateTransition:
    class_uri: vg:StateTransition
    description: "A valid state transition with optional guard condition"
    attributes:
      from_state:
        range: string
        required: true
        description: "Source state name"
      to_state:
        range: string
        required: true
        description: "Target state name"
      guard:
        range: string
        description: "Optional SQL boolean expression that must be true for this transition"
      description:
        range: string
        description: "Human-readable description of when/why this transition occurs"

  # ---------------------------------------------------------------------------
  # StateMachine: Lifecycle state machine for status-bearing entities
  # ---------------------------------------------------------------------------
  StateMachine:
    class_uri: vg:StateMachine
    description: >-
      Declares the lifecycle state machine for an entity's status column.
      Claude uses this to generate state distribution queries, transition
      analysis, and dwell-time calculations from SQL data.
    attributes:
      state_column:
        range: string
        required: true
        description: "Column containing the current state value"
      states:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 2
        description: "All valid state values"
      transitions:
        range: StateTransition
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: "Valid state transitions"
      initial_state:
        range: string
        description: "The starting state for new entities"
      terminal_states:
        range: string
        multivalued: true
        description: "States that represent end-of-lifecycle (no outgoing transitions)"

  # ---------------------------------------------------------------------------
  # FlowConfig: Material/information/financial flow metadata
  # ---------------------------------------------------------------------------
  FlowConfig:
    class_uri: vg:FlowConfig
    description: >-
      Declares flow characteristics for a relationship edge.
      Enables throughput analysis (Little's Law: L=λW), bottleneck
      detection, and conservation checking across flow networks.
    attributes:
      flow_type:
        range: FlowType
        required: true
        description: "Type of flow (material, information, financial)"
      quantity_column:
        range: string
        required: true
        description: "Column containing the flow quantity (e.g., quantity_kg, line_amount)"
      timestamp_column:
        range: string
        required: true
        description: "Column containing the flow timestamp (e.g., production_date, invoice_date)"
      conservation_group:
        range: string
        description: "Name of the conservation group this flow belongs to (e.g., procure_to_pay)"
      unit:
        range: string
        description: "Unit of measurement for quantity_column (e.g., kg, cases, USD)"
      capacity_column:
        range: string
        description: "Optional column containing capacity limit for bottleneck analysis"

  # ---------------------------------------------------------------------------
  # ActionEffect: A single effect of an action on an entity attribute
  # ---------------------------------------------------------------------------
  ActionEffect:
    class_uri: vg:ActionEffect
    description: "Describes how an action modifies an entity attribute"
    attributes:
      attribute:
        range: string
        required: true
        description: "Name of the affected attribute/column"
      effect_type:
        range: ActionEffectType
        required: true
        description: "Type of effect (set, increment, trigger_transition)"
      description:
        range: string
        description: "Human-readable description of the effect"

  # ---------------------------------------------------------------------------
  # Action: Semantic mutation definition for what-if reasoning
  # ---------------------------------------------------------------------------
  Action:
    class_uri: vg:Action
    description: >-
      Declares a named business action that mutates entity state.
      NOT executable — used for what-if reasoning and scenario documentation.
      Claude uses actions to understand causal chains and predict downstream effects.
    attributes:
      name:
        range: string
        required: true
        description: "Action name (e.g., 'allocate', 'dispatch', 'complete_production')"
      description:
        range: string
        required: true
        description: "What this action does in business terms"
      preconditions:
        range: string
        multivalued: true
        description: "Conditions that must be true before this action can occur"
      effects:
        range: ActionEffect
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: "What changes when this action executes"
      affected_relationships:
        range: string
        multivalued: true
        description: "Names of relationships affected by this action"

  # ---------------------------------------------------------------------------
  # ScenarioParam: Perturbable attribute for what-if analysis
  # ---------------------------------------------------------------------------
  ScenarioParam:
    class_uri: vg:ScenarioParam
    description: >-
      Declares an attribute that can be perturbed in what-if scenarios.
      Claude uses this to understand which parameters are meaningful to vary
      and how changes propagate through the network.
    attributes:
      attribute:
        range: string
        required: true
        description: "Column name of the perturbable attribute"
      propagation:
        range: PropagationDirection
        required: true
        description: "Direction changes propagate (upstream, downstream, local)"
      description:
        range: string
        description: "What varying this parameter means in business terms"
      default_perturbation:
        range: string
        description: "Suggested perturbation (e.g., '+10%', '-20%', 'double')"
